name: 更新 GKD 订阅

on:
  push:
    branches:
      - custom
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'wrym003/subscription' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: 提交生成的订阅文件
        run: |
          if git diff --quiet -- README.md dist/; then
            echo '订阅文件没有变化'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md dist/
          git commit -m 'chore: 更新 GKD 订阅文件'
          git push origin HEAD:custom
